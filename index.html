<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173d38" />
    <meta
      name="description"
      content="林间回声 — 一场自由、宁静的动物探索。收集微光，用叫声结识同伴，一起唤醒森林。"
    />
    <title>林间回声 · Woodland Echo</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23173d38'/%3E%3Cpath d='M16 5L7 21h6v6h6v-6h6z' fill='%23e8d995'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-BlCuzREu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CdH_Ak_w.css">
  </head>
  <body>
    <canvas id="world" aria-label="三维森林探索场景"></canvas>
    <div id="vignette"></div>
    <div id="labels" aria-hidden="true"></div>
    <header class="hud topbar">
      <div class="brand">
        <span class="brand-mark">♧</span>
        <div><strong>林间回声</strong><span>W O O D L A N D E C H O</span></div>
        <small>DEMO 01</small>
      </div>
      <div class="compass">
        <span>W</span><i></i><span id="compass-direction">N</span><i></i
        ><span>E</span>
      </div>
      <div class="top-actions">
        <span class="essence-pill"
          ><span>✧</span><b id="essence">0</b><small>微光</small></span
        ><button
          id="audio-button"
          class="icon-button"
          title="开启环境声音"
          aria-label="开启环境声音"
        >
          ♫</button
        ><button
          id="help-button"
          class="icon-button"
          title="操作指南"
          aria-label="操作指南"
        >
          ?
        </button>
      </div>
    </header>
    <aside class="hud fieldnote">
      <div class="eyebrow">THE WANDERER’S JOURNAL</div>
      <h2 id="region">风语草甸</h2>
      <div class="fine-rule"></div>
      <p id="quest-text">循着花朵的微光，走进森林。</p>
      <div class="quest-progress">
        <span id="quest-count">收集微光 0 / 30</span><span>✧</span>
      </div>
      <div class="progress-track"><i id="quest-bar"></i></div>
      <button id="journal-button" class="text-button">
        探索手记 <span>↗</span>
      </button>
    </aside>
    <div class="hud room-indicator">
      <span class="live-dot"></span
      ><span id="room-status">独自漫游 · 3 位森林伙伴</span
      ><button id="room-button">邀请同伴 +</button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="context-hint" class="hud context-hint"></div>
    <footer class="hud bottom-hud">
      <button id="den-button" class="animal-badge">
        <span class="animal-symbol" id="animal-symbol">♧</span
        ><span
          ><small>你正在扮演</small><b id="animal-name">小狐狸</b
          ><span class="stamina"><i id="stamina-bar"></i></span></span
        ><kbd>Tab</kbd>
      </button>
      <div class="action-area">
        <div id="emote-menu" hidden>
          <button data-emote="heart">♡<span>友好</span></button
          ><button data-emote="hello">✦<span>你好</span></button
          ><button data-emote="follow">➜<span>跟我来</span></button
          ><button data-emote="music">♫<span>欢呼</span></button>
        </div>
        <nav class="action-bar" aria-label="动物动作">
          <button id="call-button">
            <span>◉</span><span>呼唤</span><kbd>Q</kbd></button
          ><button id="emote-button">
            <span>♡</span><span>表情</span><kbd>E</kbd></button
          ><button id="sense-button">
            <span>◎</span><span>感知</span><kbd>F</kbd>
          </button>
          <div class="action-separator"></div>
          <button id="rest-button">
            <span>☾</span><span>休憩</span><kbd>R</kbd>
          </button>
        </nav>
        <p class="key-hint">
          <span>W A S D</span> 移动 <span>Shift</span> 奔跑
          <span>空格</span> 跳跃 <span>拖动</span> 环顾
        </p>
      </div>
      <button id="map-button" class="map-widget" aria-label="打开森林地图">
        <span class="map-north">N</span
        ><canvas id="minimap" width="240" height="240"></canvas
        ><span class="map-caption">森林地图 <kbd>M</kbd></span>
      </button>
    </footer>
    <div id="touch-controls" class="hud">
      <div id="joystick"><i></i></div>
      <div class="touch-actions">
        <button id="touch-run" aria-label="按住奔跑">奔跑</button
        ><button id="touch-jump" aria-label="跳跃">跳跃</button>
      </div>
    </div>
    <div id="loading">
      <span class="loader-symbol">♧</span>
      <h1>林间回声</h1>
      <p id="loading-text">森林正在苏醒…</p>
      <div class="loading-line"><i></i></div>
    </div>
    <dialog id="panel">
      <button id="panel-close" class="close-button" aria-label="关闭">×</button>
      <div id="panel-content"></div>
    </dialog>
    <script src="./peer-config.js"></script>
  </body>
</html>
